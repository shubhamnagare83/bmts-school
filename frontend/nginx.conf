server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be at least as large as the backend's own limits
    # (MAX_FILE_SIZE = 5 MB, express.json limit = 10 MB), otherwise Nginx
    # rejects uploads with 413 before they ever reach the backend.
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        font/woff2
        image/svg+xml;

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API requests to the backend.
    # `^~` is required so this prefix wins over the static-asset regex below —
    # without it a request like /api/export/report.css would be served from
    # the local filesystem instead of being proxied.
    location ^~ /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF generation spins up Chromium and can exceed the 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Streamed PDF/Excel downloads should not be buffered to disk first.
        proxy_buffering off;
    }

    # Proxy uploaded files (student photos, signatures) to the backend.
    # Also needs `^~`, otherwise the image regex below would intercept
    # /uploads/*.png and return 404 from the Nginx document root.
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived caching for build-hashed frontend assets.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback — serve index.html for all client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
